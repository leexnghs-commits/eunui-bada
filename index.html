<head>

<meta property="og:description" content="1580년 류큐 나하, 큰 빚을 진 상인이 되어 3년 안에 아홉 번 빚을 갚는 무역 로그라이트. 브라우저에서 바로 한 판(약 20분).">
<meta property="og:url" content="https://leexnghs-commits.github.io/eunui-bada/">
<meta property="og:image" content="https://leexnghs-commits.github.io/eunui-bada/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 16세기 해도(한지+먹선+청자색 바다), 오른쪽 장부, 아래 직원 줄. 거래 성사는 인주 도장 */
:root {
  --paper: #ebe2cb;
  --paper-2: #e0d5b9;
  --card: #f3ecda;
  --land: #d6c7a2;
  --ink: #23272c;
  --ink-soft: #5d5b51;
  --line: #b8ab89;
  --sea: #b7cfc3;
  --sea-line: #8fb0a3;
  --seal: #b1362a;
  --gold: #a3741a;
  --gold-bg: #f1dfa8;
  --good: #2e6a4e;
  --bad: #a3302a;
  --cheap: #2f6a78;
  --shade: rgba(35, 39, 44, 0.16);
  --veil: rgba(28, 30, 28, 0.55);
  --c-trade: #b5781f; --c-info: #2f7f74; --c-sea: #35598f; --c-shadow: #8e2c3b; --c-luck: #7a4a99; --c-myth: #b8306f;
  --g0: #a6324a; --g1: #8a939b; --g2: #2f5f9e; --g3: #4b5a33; --g4: #c49a1c;
  --f-display: "Song Myung", "Nanum Myeongjo", "Batang", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1d1b; --paper-2: #222623; --card: #262a27; --land: #2e322c; --ink: #e8e1cd; --ink-soft: #a7a190;
    --line: #4b4e45; --sea: #1d302c; --sea-line: #2f4a43; --seal: #e2563f; --gold: #e2b65a; --gold-bg: #4a3c18;
    --good: #72c296; --bad: #f07c68; --cheap: #6fb7c6; --shade: rgba(0, 0, 0, 0.45); --veil: rgba(0, 0, 0, 0.66); --c-trade: #e0a54a; --c-info: #5fb9a9; --c-sea: #7c9fdc; --c-shadow: #e0687a; --c-luck: #b88ae0; --c-myth: #f07ab0; --g0: #e0697f; --g1: #c3cad1; --g2: #7aa6e6; --g3: #9bb06e; --g4: #e8c24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1d1b; --paper-2: #222623; --card: #262a27; --land: #2e322c; --ink: #e8e1cd; --ink-soft: #a7a190;
  --line: #4b4e45; --sea: #1d302c; --sea-line: #2f4a43; --seal: #e2563f; --gold: #e2b65a; --gold-bg: #4a3c18;
  --good: #72c296; --bad: #f07c68; --cheap: #6fb7c6; --shade: rgba(0, 0, 0, 0.45); --veil: rgba(0, 0, 0, 0.66); --c-trade: #e0a54a; --c-info: #5fb9a9; --c-sea: #7c9fdc; --c-shadow: #e0687a; --c-luck: #b88ae0; --c-myth: #f07ab0; --g0: #e0697f; --g1: #c3cad1; --g2: #7aa6e6; --g3: #9bb06e; --g4: #e8c24a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
#app { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 18px; display: flex; flex-direction: column; gap: 10px; }

/* 상단 장부 줄 */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: 0.04em; }
.seal-mini { width: 34px; height: 34px; display: grid; place-items: center; background: var(--seal); color: var(--paper); font-family: var(--f-display); font-size: 20px; border-radius: 3px; transform: rotate(-4deg); }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat small { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }
.stat b { font-family: var(--f-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.due { min-width: 220px; flex: 1 1 240px; max-width: 360px; }
.due .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
.due .lbl b { color: var(--ink); font-weight: 600; }
.gauge { height: 10px; border: 1px solid var(--line); background: var(--paper-2); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.gauge i { display: block; height: 100%; background: var(--good); width: 0; transition: width 0.4s; }
.gauge.short i { background: var(--bad); }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.icon-btn:hover { border-color: var(--ink-soft); }

.boss { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 7px 12px; border: 1px dashed var(--line); border-radius: 4px; font-size: 13px; }
.boss .tag { font-family: var(--f-display); font-size: 16px; color: var(--seal); }
.boss.on { border: 1px solid var(--seal); background: color-mix(in srgb, var(--seal) 12%, transparent); animation: pulse 2.2s infinite; }
.boss .when { margin-left: auto; color: var(--ink-soft); font-size: 12px; }
.boss .surge { flex-basis: 100%; color: var(--bad); font-weight: 600; font-size: 12.5px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--seal) 25%, transparent); } }

/* 본문 */
.main { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: auto; max-height: 72vh; }
#map .land { fill: var(--land); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
#map .rhumb { stroke: var(--sea-line); stroke-width: 0.7; }
#map .port-dot { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
#map .port.here .port-dot { fill: var(--seal); }
#map .port.sel .port-dot { stroke: var(--seal); stroke-width: 3.5; }
#map .port.closed { opacity: 0.45; }
#map .port { cursor: pointer; }
#map .port:focus-visible .port-dot { stroke: var(--gold); stroke-width: 4; }
#map .pname { font-family: var(--f-display); font-size: 17px; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
#map .phan { font-family: var(--f-display); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
#map .pmon { font-family: var(--f-num); font-size: 11px; fill: var(--seal); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
#map .route { fill: none; stroke: var(--seal); stroke-width: 2; stroke-dasharray: 6 5; }
#map .cart text { fill: var(--ink); }
.voyage { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--card); }
.voyage p { margin: 0; flex: 1 1 260px; min-width: 0; }
.voyage .warn { color: var(--bad); font-weight: 600; }
.voyage .note { color: var(--ink-soft); font-size: 12px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; }
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.seal { background: var(--seal); border-color: var(--seal); color: var(--paper); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn:focus-visible, .icon-btn:focus-visible, .mini:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: 4px; background: var(--card); min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 9px 14px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--seal); font-weight: 600; }
.tabbody { padding: 10px 12px 12px; }
.porthead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.porthead h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.porthead span { color: var(--ink-soft); font-size: 12px; }
.porthead .shopbtn { margin-left: auto; padding: 5px 12px; font-size: 13px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px dotted var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
.gname { font-weight: 600; white-space: nowrap; }
.chip { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid currentColor; margin-left: 4px; vertical-align: 1px; font-weight: 500; }
.chip.contra { color: var(--bad); }
.chip.hot { color: var(--gold); }
.chip.cheap { color: var(--cheap); }
.sub { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 400; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.mini { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; padding: 3px 7px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.mini:hover:not(:disabled) { border-color: var(--ink); }
.mini.sell { border-color: var(--seal); color: var(--seal); font-weight: 600; }
.sell { margin-top: 3px; }
td .mini.sell { display: block; margin-left: auto; }
.mini.sell.losing { background: color-mix(in srgb, var(--bad) 14%, var(--paper)); }
.sub.gain { color: var(--good); font-weight: 600; } .sub.loss { color: var(--bad); font-weight: 600; }
.mini:disabled { opacity: 0.35; cursor: not-allowed; }
tr.hotrow td { background: color-mix(in srgb, var(--gold-bg) 70%, transparent); }
tr.cheaprow td { background: color-mix(in srgb, var(--cheap) 10%, transparent); }
tr.flip td { animation: flipIn 0.5s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes flipIn { from { transform: perspective(500px) rotateX(85deg); opacity: 0.15; } to { transform: none; opacity: 1; } }
.banner { margin: 8px 0 0; padding: 6px 10px; border-radius: 3px; background: var(--gold-bg); color: var(--ink); font-weight: 600; font-size: 13px; }
.age { font-size: 11px; color: var(--ink-soft); }
.ledger td.cell { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.ledger td.best { color: var(--good); font-weight: 600; }
.ledger td.low { color: var(--cheap); font-weight: 600; }
.rumors { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.rumors li { padding-left: 14px; position: relative; }
.rumors li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.facility { display: grid; gap: 10px; }
.facility .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.facility .row p { margin: 0; flex: 1 1 200px; }
.sched td.paid { color: var(--ink-soft); text-decoration: line-through; }
.sched tr.nextdue td { font-weight: 600; }
.report { padding: 8px 12px; max-height: 168px; overflow-y: auto; }
.report h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.report ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12.5px; }
.report li { color: var(--ink-soft); }
.report li b { font-family: var(--f-num); font-weight: 400; font-size: 11px; margin-right: 6px; }
.report li.bad { color: var(--bad); }
.report li.good { color: var(--good); }
.report li.rumor { color: var(--gold); }
.report li.warn { color: var(--ink); font-weight: 600; }

/* 직원 줄: 조커식 판화 카드. 색 = 계열, 동그라미 = 정산 방식 */
.crew { position: relative; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: flex-start; border-top: 2px solid var(--ink); padding-top: 8px; }
.crew.lift { z-index: 60; }
.crew-head { flex: 1 1 100%; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.crew-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.crew-head small { color: var(--ink-soft); }
.crew-head .btn { margin-left: auto; }
.tlegend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-soft); }
.tlegend span { display: inline-flex; align-items: center; gap: 4px; }
.tlegend i { position: static; width: 16px; height: 16px; font-size: 10px; font-style: normal; border-width: 1px; }
.emps, .cons { display: flex; flex-wrap: wrap; gap: 10px; }
.cons { margin-left: auto; padding-left: 18px; border-left: 1px dashed var(--line); }
.jslot { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.jctl { display: flex; gap: 3px; min-height: 20px; }
.jctl button { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; font-size: 11px; padding: 0 6px; line-height: 18px; cursor: pointer; }
.jctl button:disabled { opacity: 0.35; cursor: default; }
.jctl button.danger { color: var(--bad); }
.jcard { --cat: var(--c-trade); position: relative; width: 108px; height: 148px; border: 2px solid var(--ink); border-radius: 9px; background: var(--card); box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; overflow: hidden; cursor: help; transition: transform 0.15s; outline: none; }
.jcard:hover, .jcard:focus-visible { transform: translateY(-5px) rotate(-1.2deg); }
.jcard:focus-visible { box-shadow: 3px 3px 0 var(--ink), 0 0 0 3px var(--gold); }
.jcard .jname { font-weight: 700; font-size: 12.5px; text-align: center; padding: 5px 4px 3px; line-height: 1.15; border-bottom: 1.5px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jcard .art { flex: 1; display: grid; place-items: center; position: relative; color: color-mix(in srgb, var(--cat) 78%, var(--ink)); background-color: color-mix(in srgb, var(--cat) 22%, var(--card)); background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--cat) 12%, transparent) 6px 7px); }
.jcard .art svg { width: 60px; height: 60px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; position: relative; }
.jcard .jeff { font-family: var(--f-num); font-weight: 600; font-size: 12px; text-align: center; padding: 4px 3px 5px; border-top: 1.5px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jtype { position: absolute; top: 25px; right: 5px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 13px; color: var(--card); background: var(--ink); border: 1.5px solid var(--card); z-index: 1; }
.t-add { background: var(--good) !important; } .t-mult { background: var(--seal) !important; } .t-passive { background: var(--c-info) !important; }
.t-chance { background: var(--c-luck) !important; } .t-pos { background: var(--gold) !important; }
.jtier { position: absolute; bottom: 30px; left: 5px; width: 20px; height: 20px; display: grid; place-items: center; font-family: var(--f-display); font-size: 13px; color: var(--card); background: var(--ink-soft); border-radius: 3px; z-index: 1; }
.r2 .jtier { background: var(--cheap); } .r3 .jtier { background: var(--gold); } .r4 .jtier { background: var(--seal); }
.jslotno { position: absolute; top: 25px; left: 5px; font-family: var(--f-num); font-size: 11px; font-weight: 600; background: var(--card); border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 4px; z-index: 1; }
.jcard.r2::after { content: ""; position: absolute; inset: 3px; border: 1.5px solid var(--cheap); border-radius: 6px; pointer-events: none; }
.jcard.r3 { border-color: var(--gold); box-shadow: 3px 3px 0 var(--gold); }
.jcard.r3::after { content: ""; position: absolute; inset: 3px; border: 2px solid var(--gold); border-radius: 6px; pointer-events: none; }
.jcard.r3 .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--gold) 45%, transparent) 48%, transparent 62%); background-size: 260% 100%; animation: foil 3.4s linear infinite; }
@keyframes foil { from { background-position: 160% 0; } to { background-position: -110% 0; } }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.jcard.r4 { border: 3px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, conic-gradient(from var(--ang), #e0533a, #e8c24a, #5fb9a9, #7c9fdc, #b88ae0, #e0533a) border-box; box-shadow: 0 0 16px color-mix(in srgb, var(--gold) 55%, transparent), 3px 3px 0 var(--ink); animation: spinang 4s linear infinite; }
.jcard.r4 .art { background-image: linear-gradient(125deg, rgba(224, 83, 58, .16), rgba(232, 194, 74, .16), rgba(95, 185, 169, .16), rgba(184, 138, 224, .18)); }
.jcard.r4 .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .45) 47%, transparent 64%); background-size: 260% 100%; animation: foil 2.6s linear infinite; }
.jcard.r4 .jname { color: var(--seal); }
@keyframes spinang { to { --ang: 360deg; } }
.t-retrig { background: var(--gold) !important; } .t-copy { background: var(--c-myth) !important; }
.casc li.banner { border-left-color: var(--gold); background: var(--gold-bg); font-weight: 700; }
.mythnote { margin: 4px 0 0; padding: 6px 10px; border-radius: 4px; background: var(--gold-bg); font-weight: 700; }
.jcard.tok { width: 92px; height: 132px; border-radius: 44px 44px 9px 9px; }
.jcard.tok .jname { padding-top: 9px; }
.jcard.empty { border: 2px dashed var(--line); box-shadow: none; background: transparent; color: var(--ink-soft); display: grid; place-items: center; text-align: center; font-size: 12px; cursor: default; }
.jcard.empty:hover { transform: none; }
.emp.fire { animation: bump 0.38s ease-out; }
@keyframes bump { 0% { transform: none; } 35% { transform: translateY(-14px) scale(1.08) rotate(-2deg); } 100% { transform: none; } }
.floaty { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-family: var(--f-num); font-weight: 700; font-size: 18px; color: var(--seal); paint-order: stroke; -webkit-text-stroke: 3px var(--card); pointer-events: none; animation: rise 0.9s ease-out forwards; white-space: nowrap; z-index: 2; }
@keyframes rise { to { transform: translate(-50%, -30px); opacity: 0; } }
.tip { position: fixed; z-index: 90; max-width: 270px; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 9px 11px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 8px 24px var(--shade); pointer-events: none; }
.tip .t { font-size: 15px; font-weight: 700; display: block; margin-bottom: 2px; }
.tip .kind { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin: 0 3px 4px 0; background: color-mix(in srgb, var(--paper) 18%, transparent); }
.tip .meta { opacity: 0.72; font-size: 11.5px; margin-top: 3px; }
.shop-h { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 10px 0 4px; }
.shop-row { display: flex; flex-wrap: wrap; gap: 16px; }
.shopitem { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 120px; }

.survey { margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 6px; display: grid; gap: 8px; }

.sv-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.overlay { position: fixed; inset: 0; z-index: 50; background: var(--veil); display: grid; place-items: center; padding: 16px; overflow-y: auto; }

.hint { font-size: 11px; color: var(--ink-soft); text-align: right; margin-top: 8px; }

  // 등급: 1=정, 2=병, 3=을, 4=갑. [등급, 고용비, 기본급(월)]

  // ── 난수 (상태에 저장되어 재현 가능) ───────────────────────
  function rand(s) {

  // ── 기본 질의 ───────────────────────────────────────────
  const has = (s, id) => s.employees.indexOf(id) >= 0;
  const yearIdx = (m) => Math.floor(m / 12);
  function dateLabel(m) { return (1580 + yearIdx(m)) + '년 ' + ((m % 12) + 1) + '월'; }
  function normalPrice(p, g) { return GOODS[g].base * FACTOR[p][g]; }
  function capacity(s) { return s.cap + (has(s, 'owner') ? 40 : 0) + (has(s, 'porter') ? 15 : 0) - s.guns * 2; }

  function closedPorts(s, m) {

  function nextDue(s) { return SCHEDULE[s.paid] || null; }
  function cargoValue(s, p) { let v = 0; for (let g = 0; g < 5; g++) v += s.hold[g] * s.prices[p][g]; return v; }
  function netWorth(s) {
    let v = s.cash + s.bank;

  function log(s, text, tone) { s.log.unshift({ m: s.month, text, tone: tone || '' }); if (s.log.length > 40) s.log.pop(); }

  // 시장 충격은 지수형: 사면 P·e^(q/d), 팔면 P·e^(-q/d). 사고팔기가 정확히 역연산이라
  // 같은 항구에서 어떤 순서로 왕복해도 손익 0(시세 조작으로 돈이 생기지 않음)
  function buyCost(P, d, q) { return P * d * (Math.exp(q / d) - 1); }
  function priceAfterBuy(P, d, q) { return P * Math.exp(q / d); }
  function sellRev(P, d, q) { return P * d * (1 - Math.exp(-q / d)); }
  function priceAfterSell(P, d, q) { return P * Math.exp(-q / d); }

  // ── 새 게임 ─────────────────────────────────────────────
  const DIFFS = { easy: { name: '견습', mult: 0.75, graces: 2 }, normal: { name: '상인', mult: 1, graces: 1 }, hard: { name: '거상', mult: 2, graces: 0, ramp: [1.3, 1.5, 2, 2.5, 3.5, 4.5, 6, 8, 10] } };

          s.cash += q * unit; have += q * unit; fire.amount += q * unit; fire.goods.push(GOODS[g].name + ' ' + q + GOODS[g].unit);
        }
        log(s, '현금이 모자라 수금꾼이 ' + fire.goods.join(', ') + '을(를) 시세 절반에 급매했다(' + Math.round(fire.amount).toLocaleString() + '냥).', 'bad');
      }
      const r = { due: d, amt, tax, total, have, ok: have >= total, ratio: have / total, bonus: null, fire };
      if (!r.ok) { s.over = 'bankrupt'; results.push(r); log(s, '상환 실패. 진 대인의 사람들이 배를 압류했다.', 'bad'); break; }
      s.carry = 0;
      let left = total; const fromCash = Math.min(s.cash, left); s.cash -= fromCash; left -= fromCash; s.bank -= left; clampMoney(s);
      if (r.ratio >= 2) {
        if (s.consumables.length < MAX_CONS) { const id = CONSUMABLES[randInt(s, CONSUMABLES.length)].id; s.consumables.push(id); r.bonus = { cons: id }; }
        else { const c = Math.round(dueAmt(s, d) * 0.1); s.cash += c; r.bonus = { cash: c }; }
      }
      s.paid++;
      if (s.reward) { const c = s.reward.options.find((o) => o.type === 'cash'); if (c) { s.cash += c.amount; log(s, '고르지 않은 결산 보상을 현금 ' + c.amount.toLocaleString() + '냥으로 받았다.'); } s.reward = null; }
      if (!d.final) s.reward = genReward(s, d);
      log(s, (1580 + yearIdx(d.due)) + '년 ' + ((d.due % 12) + 1) + '월 상환 ' + total.toLocaleString() + '냥 완료.', 'good');
      results.push(r);
      if (d.final) { s.win = true; break; }
    }
    return results;
  }

  // ── 항해 ───────────────────────────────────────────────
  function canTravel(s, dest) {
    if (s.pending) return LOCK;
    if (!Number.isInteger(dest) || dest < 0 || dest >= PORTS.length) return { ok: false, reason: '항구 번호가 잘못됐습니다' };
    if (dest === s.port) return { ok: false, reason: '이미 이 항구에 있습니다' };
    if (closedPorts(s).indexOf(dest) >= 0) return { ok: false, reason: '역병으로 봉쇄된 항구입니다' };
    { const m = travelMonths(s, s.port, dest); for (let i = 1; i <= m; i++) if (closedPorts(s, s.month + i).indexOf(dest) >= 0) return { ok: false, reason: '도착할 무렵 역병으로 봉쇄되는 항구입니다' }; }
    if (cargoUsed(s) > capacity(s)) return { ok: false, reason: '화물이 화물칸을 넘칩니다' };
    return { ok: true, months: travelMonths(s, s.port, dest) };
  }

  function loseCargo(s, lo, hi) {
    const lost = [0, 0, 0, 0, 0];
    for (let g = 0; g < 5; g++) {
      const l = Math.round(s.hold[g] * (lo + rand(s) * (hi - lo)));
      s.hold[g] -= l; lost[g] = l; if (s.hold[g] === 0) s.basis[g] = 0;
    }
    return lost;
  }
  function lostText(lost) {
    const parts = []; lost.forEach((l, g) => { if (l > 0) parts.push(GOODS[g].name + ' ' + l + GOODS[g].unit); });
    return parts.length ? parts.join(', ') : '잃은 화물 없음';
  }

  function startVoyage(s, dest) {
    const t = canTravel(s, dest); if (!t.ok) return t;
    const months = t.months;
    const settled = settle(s, s.month + months);
    const wageLeft = s.over || s.win ? [] : payWages(s);
    if (s.over || s.win) return { ok: true, settled, ended: true };
    const events = [];
    const boss = bossActive(s);
    if (!has(s, 'navigator')) {
      for (let i = 0; i < months; i++) {
        if (rand(s) < stormMonthly(s, s.month + i)) {
          const lost = has(s, 'chanty') ? loseCargo(s, 0.05, 0.125) : loseCargo(s, 0.1, 0.25);
          let text = lost.some((x) => x > 0) ? '폭풍을 만났다. ' + lostText(lost) + ' 유실.' : '폭풍을 만났지만 화물은 무사했다.';
          if (rand(s) < 0.34) {
            const opts = [0, 1, 2, 3, 4, 5].filter(p => p !== dest && p !== s.port && closedPorts(s, s.month + months).indexOf(p) < 0);
            if (opts.length) { dest = opts[randInt(s, opts.length)]; text += ' 항로를 벗어나 ' + PORTS[dest].name + '(으)로 떠밀려 간다.'; }
          }
          events.push({ type: 'storm', text }); log(s, text, 'bad');
        }
      }
    }
    s.stats.voyages++;
    let pirate = null;
    if (s.flags.pass) { s.flags.pass = false; events.push({ type: 'pass', text: '통행증 덕분에 해적이 길을 비켰다.' }); }
    else {
      const p = pirateRisk(s, s.port, dest, months);
      if (rand(s) < p) {
        const fleet = fleetSize(s);
        if (has(s, 'wokou')) {
          const toll = Math.round(Math.min(s.cash, Math.max(20, cargoValue(s, s.port) * 0.05))); s.cash -= toll;
          const text = '해적 ' + fleet + '척. 왜구 연줄이 통행세 ' + toll.toLocaleString() + '냥으로 정리했다.';
          events.push({ type: 'toll', text }); log(s, text);
        } else pirate = fleet;
      }
    }
    if (pirate) { s.pending = { type: 'pirate', fleet: pirate, dest, months }; return { ok: true, settled, events, pirate, wageLeft }; }
    const arrival = finishVoyage(s, dest, months);
    return { ok: true, settled, events, arrival, wageLeft };
  }

  // 월간 해적 확률: 해마다 증가, 창궐 항로 3배, 비싼 화물일수록 증가(최대 2배), 대포는 억지력(1문당 −4%, 최대 −60%)
  function pirateMonthly(s, from, to, m) {
    if (m === undefined) m = s.month;
    let base = [0.06, 0.12, 0.16][Math.min(2, yearIdx(m))];
    if ((s.surges || []).some((x) => x.p === from || x.p === to)) base *= 3;
    const b = bossActive(s, m); if (b && b.id === 'pirateKing') base *= 2.5;
    base *= 1 + Math.min(1, cargoValue(s, s.port) / 20000);
    base *= Math.max(0.4, 1 - 0.04 * s.guns);
    return Math.min(0.8, base);
  }
  function stormMonthly(s, m) {
    if (m === undefined) m = s.month;
    if (has(s, 'navigator')) return 0;
    let p = 0.07;
    if ([6, 7, 8].indexOf(m % 12) >= 0) p *= 2;
    p *= 1 + Math.min(1, cargoValue(s, s.port) / 30000);
    return Math.min(0.5, p);
  }
  function stormRisk(s, months) { let q = 1; for (let i = 0; i < months; i++) q *= 1 - stormMonthly(s, s.month + i); return 1 - q; }
  function pirateRisk(s, from, to, months) { let q = 1; for (let i = 0; i < months; i++) q *= 1 - pirateMonthly(s, from, to, s.month + i); return 1 - q; }
  function fleetSize(s) {
    const b = bossActive(s);
    return Math.min(40, 2 + randInt(s, 4) + yearIdx(s.month) * 3 + Math.floor(cargoValue(s, s.port) / 5000) + (b && b.id === 'pirateKing' ? 5 : 0));
  }
  function pirateOdds(s, fleet) {
    const power = s.guns * (has(s, 'gunner') ? 2 : 1);
    return {
      fight: power > 0 ? Math.pow(power, 1.5) / (Math.pow(power, 1.5) + Math.pow(fleet * 0.8, 1.5)) : 0,
      run: Math.max(0.15, Math.min(0.8, 0.6 - fleet * 0.03)),
      toll: Math.round(Math.max(50, cargoValue(s, s.port) * 0.2)),
    };
  }

  function resolvePirate(s, choice) {
    const pd = s.pending; if (!pd || pd.type !== 'pirate') return { ok: false };
    const o = pirateOdds(s, pd.fleet);
    const out = { choice, fleet: pd.fleet };
    if (choice === 'fight') {
      if (rand(s) < o.fight) {
        const booty = Math.round(pd.fleet * (120 + 160 * yearIdx(s.month)) * (has(s, 'gunner') ? 1.5 : 1) * (0.8 + 0.4 * rand(s)));
        s.cash += booty; s.stats.booty += booty;
        const g = randInt(s, 4), take = Math.min(freeSpace(s), pd.fleet * 4);
        if (take > 0) { s.basis[g] = (s.basis[g] * s.hold[g]) / (s.hold[g] + take); s.hold[g] += take; }
        out.result = 'win'; out.booty = booty; out.text = '해적 ' + pd.fleet + '척을 격파했다. 약탈품 ' + booty.toLocaleString() + '냥' + (take > 0 ? '과 ' + GOODS[g].name + ' ' + take + GOODS[g].unit + '(원가 0)' : '') + '.';
        log(s, out.text, 'good');
      } else {
        const lost = loseCargo(s, 0.5, 0.8);
        if (s.guns > 0) s.guns--;
        out.result = 'lose'; out.text = '패배했다. ' + lostText(lost) + '을(를) 빼앗기고 대포 하나를 잃었다.';
        log(s, out.text, 'bad');
      }
    } else if (choice === 'run') {
      if (rand(s) < o.run) { out.result = 'escaped'; out.text = '바람을 타고 따돌렸다.'; }
      else { const lost = loseCargo(s, 0.25, 0.5); out.result = 'caught'; out.text = '따라잡혔다. ' + lostText(lost) + '을(를) 빼앗겼다.'; log(s, out.text, 'bad'); }
    } else {
      const toll = Math.min(s.cash, Math.round(o.toll)); s.cash -= toll;
      out.result = 'paid'; out.text = '통행세 ' + Math.round(toll).toLocaleString() + '냥을 내고 지나갔다.';
      log(s, out.text);
    }
    s.pending = null;
    out.arrival = finishVoyage(s, pd.dest, pd.months);
    return Object.assign({ ok: true }, out);
  }

  function wageOf(s, id) { return Math.round(EMP[id].wage * (1 + 0.5 * yearIdx(s.month))); }
  function owedTotal(s) { return Object.values(s.owed || {}).reduce((a, b) => a + b, 0); }
  // 밀린 월급은 출항할 때 현금, 모자라면 예금에서 지급. 그래도 모자라면 많이 밀린 직원부터 떠난다
  function payWages(s) {
    s.owed = s.owed || {};
    let total = owedTotal(s);
    if (total <= 0) return [];
    const left = [];
    while (total > s.cash + s.bank && s.employees.length) {
      let worst = 0; s.employees.forEach((id, i) => { if ((s.owed[id] || 0) > (s.owed[s.employees[worst]] || 0)) worst = i; });
      const id = s.employees[worst];
      log(s, '밀린 월급 ' + Math.round(s.owed[id] || 0) + '냥을 못 받은 ' + EMP[id].name + '이(가) 떠났다.', 'bad');
      left.push(id); delete s.owed[id]; s.employees.splice(worst, 1);
      total = owedTotal(s);
    }
    const fromCash = Math.min(s.cash, total); s.cash -= fromCash; s.bank -= (total - fromCash); clampMoney(s);
    s.owed = {};
    dumpOverflow(s);
    return left;
  }
  function dumpOverflow(s) {
    let over = cargoUsed(s) - capacity(s);
    if (over > 0) {
      for (let g = 4; g >= 0 && over > 0; g--) { const d = Math.min(over, s.hold[g]); s.hold[g] -= d; over -= d; if (!s.hold[g]) s.basis[g] = 0; }
      log(s, '화물칸이 줄어 넘치는 짐을 바다에 버렸다.', 'bad');
    }
  }

  function clampMoney(s) { if (s.cash < 0 && s.cash > -1) s.cash = 0; if (s.bank < 0 && s.bank > -1) s.bank = 0; }
  function monthTick(s) {
    s.owed = s.owed || {};
    s.employees.forEach((id) => { s.owed[id] = (s.owed[id] || 0) + wageOf(s, id); });
    s.bank *= 1.01;
    if (has(s, 'rumor')) {
      let old = -1;
      for (let p = 0; p < PORTS.length; p++) if (p !== s.port && (old < 0 || s.known[p].month < s.known[old].month)) old = p;
      if (old >= 0) s.known[old] = { prices: s.prices[old].map(Math.round), month: s.month + 1 };
    }
    if ((s.month + 1) % 12 === 6) log(s, '태풍 철이 시작됐다. 7~9월은 폭풍이 두 배로 잦다. 비싼 화물일수록 위험하다.', 'warn');
    stepMarket(s);
    s.month++;
  }

  function finishVoyage(s, dest, months) {
    for (let i = 0; i < months; i++) monthTick(s);
    s.port = dest; s.lastVoyageMonths = months;
    return arrive(s, true);
  }

  function arrive(s, newPort) {
    const p = s.port;
    const prev = s.known[p] ? { prices: s.known[p].prices.slice(), month: s.known[p].month } : null;
    refreshKnown(s);
    const events = [];
    const boss = bossActive(s);
    const shielded = s.flags.letter; s.flags.letter = false;
    // 유황 압수
    if (s.hold[4] > 0 && PORTS[p].seize > 0 && !has(s, 'wokou')) {
      const pr = PORTS[p].seize * (boss && boss.id === 'customs' ? 3 : 1) * (yearIdx(s.month) === 0 ? 0.5 : 1) + (has(s, 'smuggler') ? 0.05 : 0);
      if (rand(s) < pr) {
        if (shielded) events.push({ type: 'shield', text: '세관이 유황을 뒤지려 했지만 청탁서를 보이자 물러났다.' });
        else {
          const lost = s.hold[4]; s.hold[4] = 0; s.basis[4] = 0;
          const fine = Math.round(s.cash * 0.2 * (has(s, 'customsman') ? 2 : 1)); s.cash -= fine;
          const text = '세관에 유황 ' + lost + '섬을 압수당하고 벌금 ' + fine.toLocaleString() + '냥을 냈다.';
          events.push({ type: 'seize', text }); log(s, text, 'bad');
        }
      }
    }
    if (boss && boss.id === 'customs' && (p === 3 || p === 4)) {
      const tax = Math.round(s.cash * 0.05); s.cash -= tax;
      const text = '해금 단속관이 입항세 ' + tax.toLocaleString() + '냥을 걷어 갔다.';
      events.push({ type: 'tax', text }); log(s, text, 'bad');
    }
    if (s.cash > 2500 && !PORTS[p].home && rand(s) < 0.06) {
      if (shielded) events.push({ type: 'shield', text: '부둣가 패거리가 다가왔지만 청탁서 덕에 손대지 못했다.' });
      else {
        const robbed = Math.round(s.cash * (0.3 + 0.2 * rand(s))); s.cash -= robbed;
        const text = '부둣가에서 강도를 만나 현금 ' + robbed.toLocaleString() + '냥을 털렸다. 큰돈은 나하 은행에 맡기자.';
        events.push({ type: 'rob', text }); log(s, text, 'bad');
      }
    }
    // 소문 적중 확인
    const confirmed = [];
    for (let g = 0; g < 5; g++) {
      const ratio = s.prices[p][g] / normalPrice(p, g);
      const r = s.rumors.find(x => x.p === p && x.g === g && x.month >= s.month - 4);
      if (r && ((r.up && ratio >= 1.4) || (!r.up && ratio <= 0.7))) confirmed.push(g);
    }
    s.soldVisit = {}; s.portSales = 0;
    if (newPort) { s.firstSale = true; s.boughtVisit = [0, 0, 0, 0, 0]; s.shop = genShop(s); }
    s.lastReveal = { port: p, prev, now: s.prices[p].slice(), confirmed, newPort };
    return { port: p, events, reveal: s.lastReveal };
  }

  function waitMonth(s) {
    if (s.pending) return LOCK;
    const settled = settle(s, s.month + 1);
    const wageLeft = s.over || s.win ? [] : payWages(s);
    if (s.over || s.win) return { ok: true, settled, ended: true };
    monthTick(s);
    const arrival = arrive(s, false);
    return { ok: true, settled, arrival, wageLeft };
  }

  root.Engine = {
    PORTS, GOODS, FACTOR, SCHEDULE, BOSSES, EMPLOYEES, EMP, CONSUMABLES, CONS, MAX_EMP, MAX_CONS,
    newGame, dateLabel, yearIdx, normalPrice, capacity, cargoUsed, freeSpace, travelMonths, dist,
    bossOfYear, bossActive, closedPorts, nextDue, dueAmount, cargoValue, netWorth,
    maxBuy, buy, sell, sellQuote, buyCost, depthOf,
    DIFFS, dueAmt, totalDebt, RANKS, finalRank, TIERS, wageOf, genShop, pickStarter, previewHire, fuseOdds, fuse, pickReward, consCost, reroll, rerollCost, hire, fire, moveEmp, buyCons, useCons,
    buyGun, gunCost, upgradeShip, shipCost, bankMove,
    canTravel, startVoyage, owedTotal, pirateRisk, stormRisk, pirateOdds, resolvePirate, waitMonth, has,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const E = window.Engine;
  const KEY = 'eunui-bada.v1';
  const $ = (q) => document.querySelector(q);
  const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let S = null, busy = false, selDest = null, tab = 'market', revealPending = false, fireConfirm = -1;

  // ── 저장 ──
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function loadSaved() {
    try { const t = localStorage.getItem(KEY); if (!t) return null; const s = JSON.parse(t); if (s && s.v === 1 && !s.over && !s.win) return s; } catch (e) {}
    return null;
  }

  // ── 소리 ──
  let AC = null, soundOn = false;
  function initAudio() {
    if (AC) return;
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); soundOn = true; $('#btn-sound').textContent = '소리 끄기'; } catch (e) { AC = null; }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!AC || !soundOn) return;
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function thud(big) {
    if (!AC || !soundOn) return;
    tone(big ? 120 : 160, 0.22, 'sine', big ? 0.5 : 0.35, 40);
    const t = AC.currentTime, len = 0.12, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = big ? 0.35 : 0.22;
    src.buffer = buf; src.connect(f).connect(g).connect(AC.destination); src.start(t);
  }
  function coinSound(n) { for (let i = 0; i < n; i++) setTimeout(() => tone(1800 + Math.random() * 900, 0.08, 'square', 0.03), i * 45); }
  function chime() { [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'sine', 0.1), i * 90)); }
  document.addEventListener('pointerdown', initAudio, { once: true });
  $('#btn-sound').addEventListener('click', () => {
    initAudio(); if (!AC) return;
    soundOn = !soundOn; $('#btn-sound').textContent = soundOn ? '소리 끄기' : '소리 켜기';
  });

  // ── 지도 ──

  function curve(a, b) {

    return { ax, ay, bx, by, cx: mx - (dy / len) * len * 0.18, cy: my + (dx / len) * len * 0.18 };
  }

  function animateShip(from, to, months, t0, t1) {
    t0 = t0 || 0; t1 = t1 === undefined ? 1 : t1;
    return new Promise((resolve) => {
      if (reduce) { shipPos = null; resolve(); return; }
      const c = curve(from, to), dur = Math.max(500, months * 700 * (t1 - t0)), st = performance.now();
      let done = false;
      const res = () => { if (!done) { done = true; resolve(); } };
      setTimeout(res, dur + 400); // 탭이 가려져 프레임이 멈춰도 진행
      function f(now) {
        if (done) return;
        const k = Math.min(1, (now - st) / dur), t = t0 + (t1 - t0) * (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
        const [x, y] = onCurve(c, t);
        shipPos = [x + 4, y - 14 + Math.sin(now / 120) * 1.2];
        $('#ship').innerHTML = shipSvg(shipPos[0], shipPos[1]);
        if (k < 1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
  }

  function bestElsewhere(g) {

  function marketHtml() {

    const order = [0, 1, 2, 3, 4].sort((a, b) => (S.hold[a] > 0) - (S.hold[b] > 0)); // 내 화물은 마지막에 뒤집힘
    const delay = {}; order.forEach((g, i) => { delay[g] = i * 0.16; });
    let rows = '';
    let banners = [];
    E.GOODS.forEach((G, g) => {

      const hot = ratio >= 1.5, cheap = ratio <= 0.65;
      const best = bestElsewhere(g);
      const mb = E.maxBuy(S, g);
      const q = S.hold[g];
      const quote = q ? E.sellQuote(S, g, q) : 0;
      const pl = q ? quote - S.basis[g] * q : 0;
      if (rv && rv.confirmed.indexOf(g) >= 0) banners.push('소문이 맞았다! ' + E.PORTS[p].name + '의 ' + G.name + ' 값');

      rows += '<tr class="' + (hot ? 'hotrow' : cheap ? 'cheaprow' : '') + (rv ? ' flip' : '') + '" style="' + (rv ? 'animation-delay:' + delay[g] + 's' : '') + '">' +

  function ledgerHtml() {
    let head = '<tr><th>항구</th>' + E.GOODS.map((g) => '<th class="r">' + g.name + '</th>').join('') + '</tr>';
    const cols = E.GOODS.map((g, gi) => E.PORTS.map((p) => S.known[p.id].prices[gi]));
    let body = '';
    E.PORTS.forEach((p) => {
      const k = S.known[p.id], age = S.month - k.month, op = age <= 0 ? 1 : Math.max(0.45, 1 - age * 0.1);
      body += '<tr><td><b>' + p.name + '</b><span class="sub age">' + (p.id === S.port ? '여기, 지금' : ageText(age)) + '</span></td>' +
        E.GOODS.map((g, gi) => {
          const v = k.prices[gi], mx = Math.max.apply(null, cols[gi]), mn = Math.min.apply(null, cols[gi]);
          return '<td class="cell' + (v === mx ? ' best' : v === mn ? ' low' : '') + '" style="opacity:' + op + '">' + fmt(v) + '</td>';
        }).join('') + '</tr>';
    });
    const rum = S.rumors.filter((r) => r.month >= S.month - 4).map((r) => '<li>' + E.dateLabel(r.month) + ': ' + E.PORTS[r.p].name + ' ' + E.GOODS[r.g].name + ' ' + (r.up ? '폭등' : '폭락') + '</li>').join('');
    return '<div class="tbl-wrap"><table class="ledger"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="legend"><span style="color:var(--good)">초록: 장부상 가장 비싼 곳(팔 곳)</span><span style="color:var(--cheap)">청록: 가장 싼 곳(살 곳)</span><span>흐릴수록 오래된 정보</span></div>' +

  $('#tabbody').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || busy) return;
    if (b.dataset.shop !== undefined) { openShop(); return; }
    if (b.dataset.buy !== undefined) {
      const g = +b.dataset.buy, q = b.dataset.q === 'max' ? E.maxBuy(S, g) : 10;
      const r = E.buy(S, g, q);
      if (r.ok) TELE.ev('buy', { g, q: r.q, cost: Math.round(r.cost), m: S.month, port: S.port, max: b.dataset.q === 'max' });
      if (!r.ok) toast(r.reason); else { tone(520, 0.06, 'square', 0.05); coinSound(2); }
      revealPending = false; renderAll(); save();
    } else if (b.dataset.sell !== undefined) {
      const g = +b.dataset.sell, qh = S.hold[g], quoted = qh ? Math.round(E.sellQuote(S, g, qh) - S.basis[g] * qh) : 0;
      const r = E.sell(S, g, S.hold[g]);
      if (r.ok) { const cm = r.steps.find((x) => x.kind === 'comm'); TELE.ev('sell', { g, q: r.q, profit: Math.round(r.profit), rev: Math.round(r.rev), steps: r.steps.filter((x) => x.emp).length, comm: cm ? Math.round(-cm.amount) : 0, quoted, loss: r.profit < 0, m: S.month, port: S.port, emps: S.employees.slice() }); }
      if (!r.ok) { toast(r.reason); return; }
      revealPending = false;
      busy = true; await playCascade(r); busy = false;
      renderAll(); save();
    } else if (b.dataset.bank) {
      const v = b.dataset.bank, amt = v === 'all' ? S.cash : v === '-all' ? -S.bank : +v;
      const r = E.bankMove(S, amt); if (!r.ok) toast(r.reason); else TELE.ev('bank', { amt: Math.round(amt), m: S.month }); renderAll(); save();
    } else if (b.dataset.up) {
      const r = b.dataset.up === 'ship' ? E.upgradeShip(S) : E.buyGun(S);
      if (r.ok) TELE.ev(b.dataset.up === 'ship' ? 'upgrade' : 'gun', { m: S.month, lv: S.shipLv, guns: S.guns });
      if (!r.ok) toast(r.reason); else thud(false);
      renderAll(); save();
    }
  });

  };
  function icon(key) { return '<svg viewBox="0 0 48 48" aria-hidden="true">' + (ICONS[key] || '') + '</svg>'; }
  function empShort(id, mode) {
    if (id === 'assayer') return '은 ×' + (1 + 0.2 * (S.silverSales + 1)).toFixed(1);
    if (id === 'clerk') return '전부 ×' + (1 + 0.15 * Math.max(1, S.employees.length + (mode === 'shop' ? 1 : 0))).toFixed(2);
    if (id === 'miser') return '+' + Math.min(450, Math.floor((S.cash + S.bank) / 1000) * 15) + ' (현금 비례)';
    if (id === 'apprentice') return '+' + Math.min(300, 20 + 10 * (S.appSales || 0)) + ' (성장 중)';
    if (id === 'seaking') return '×' + (1 + 0.12 * (S.freshSales || 0)).toFixed(2) + ' (실적마다↑)';
    if (id === 'mint') return '×' + Math.min(4, 1 + 0.1 * Math.floor((S.cash + S.bank) / 10000)).toFixed(1) + ' (재산 비례)';
    return META[id].short;
  }
  function empCard(id, idx, mode) {
    const e = E.EMP[id], m = META[id], t = TYPE[m.type];
    return '<div class="jcard emp r' + e.rarity + '"' + (mode === 'crew' ? ' data-idx="' + idx + '"' : '') + ' data-tip="emp:' + id + ':' + mode + '" tabindex="0" style="--cat:var(--c-' + m.cat + ')">' +
      '<div class="jname">' + e.name + '</div><div class="art">' + icon(id) + '</div><div class="jeff">' + empShort(id, mode) + '</div>' +
      '<span class="jtype t-' + m.type + '" aria-hidden="true">' + t[0] + '</span>' +
      '<span class="jtier" aria-label="' + E.TIERS[e.rarity].name + '급">' + E.TIERS[e.rarity].hanja + '</span>' +
      (mode === 'crew' ? '<span class="jslotno">' + (idx + 1) + '</span>' : '') + '</div>';
  }
  function conCard(id) {
    const k = E.CONS[id], isLedger = k.good !== undefined;
    const style = isLedger ? '--cat:var(--g' + k.good + ');--g:var(--g' + k.good + ')' : '--cat:var(--c-' + CONMETA[id].cat + ')';
    return '<div class="jcard tok" data-tip="con:' + id + '" tabindex="0" style="' + style + '"><div class="jname">' + k.name + '</div>' +
      '<div class="art">' + icon(isLedger ? 'ledger' : id) + '</div><div class="jeff">' + (isLedger ? '배수 +0.5' : CONMETA[id].short) + '</div></div>';
  }
  function tipHtml(key) {
    const [kind, id, mode] = key.split(':');
    if (kind === 'emp') {
      const e = E.EMP[id], m = META[id], t = TYPE[m.type];
      const T = E.TIERS[e.rarity], rare = T.name + '급(' + T.hanja + ')';
      return '<span class="t">' + e.name + '</span><span class="kind">' + t[0] + ' ' + t[1] + '</span><span class="kind">' + CATNAME[m.cat] + '</span><span class="kind">' + rare + '</span>' +
        '<div>' + e.desc + '</div><div class="meta">' + t[2] + '</div>' +
        '<div class="meta">성과급: 이 직원이 늘린 이익의 ' + Math.round(T.comm * 100) + '%</div>' +
        '<div class="meta">' + (mode === 'shop' ? '고용비 ' + fmt(e.cost) + '냥, ' : '') + '월급 ' + E.wageOf(S, id) + '냥(해마다 오름)</div>';
    }
    const k = E.CONS[id];
    return '<span class="t">' + k.name + '</span><span class="kind">소모품</span><div>' + k.desc + '</div><div class="meta">한 번 쓰면 사라집니다. 값 ' + fmt(k.cost) + '냥</div>';
  }
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  function showTip(el) {
    tip.innerHTML = tipHtml(el.dataset.tip); tip.hidden = false;
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const x = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2));
    let y = r.top - th - 10; if (y < 8) y = r.bottom + 10;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.hidden = true; }
  document.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip();
  });

  function renderCrew() {
    hideTip();
    let h = '';
    for (let i = 0; i < E.MAX_EMP; i++) {
      const id = S.employees[i];
      if (!id) { h += '<div class="jslot"><div class="jcard empty">' + (i + 1) + '번<br>빈 자리</div><div class="jctl"></div></div>'; continue; }
      h += '<div class="jslot">' + empCard(id, i, 'crew') + '<div class="jctl">' +
        '<button type="button" data-mv="' + i + '" data-dir="-1" aria-label="왼쪽으로"' + (i === 0 ? ' disabled' : '') + '>◀</button>' +
        '<button type="button" data-mv="' + i + '" data-dir="1" aria-label="오른쪽으로"' + (i === S.employees.length - 1 ? ' disabled' : '') + '>▶</button>' +
        '<button type="button" class="danger" data-fire="' + i + '">' + (fireConfirm === i ? '정말?' : '해고') + '</button></div></div>';
    }
    $('#emps').innerHTML = h;
    let c = '';
    for (let i = 0; i < E.MAX_CONS; i++) {
      const id = S.consumables[i];
      if (!id) { c += '<div class="jslot"><div class="jcard tok empty">소모품<br>빈 자리</div><div class="jctl"></div></div>'; continue; }
      c += '<div class="jslot">' + conCard(id) + '<div class="jctl"><button type="button" data-use="' + i + '">사용</button></div></div>';
    }
    $('#cons').innerHTML = c;
  }
  $('#crew').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || busy) return;
    if (b.id === 'btn-shop') { openShop(); return; }
    if (b.id === 'btn-fuse') { fuseSel = []; openFuse(); return; }
    if (b.dataset.mv !== undefined) { E.moveEmp(S, +b.dataset.mv, +b.dataset.dir); fireConfirm = -1; renderCrew(); save(); }
    else if (b.dataset.fire !== undefined) {
      const i = +b.dataset.fire;
      if (fireConfirm !== i) { fireConfirm = i; renderCrew(); return; }
      const fid = S.employees[i]; const r = E.fire(S, i); fireConfirm = -1; if (r.ok) TELE.ev('fire', { id: fid, m: S.month }); if (!r.ok) toast(r.reason); renderAll(); save();
    } else if (b.dataset.use !== undefined) {
      const ui = +b.dataset.use;
      if (S.consumables[ui] === 'whisper') { pickPortFor(ui); return; }
      const cid = S.consumables[ui]; const r = E.useCons(S, ui); if (r.ok) TELE.ev('cons_use', { id: cid, m: S.month });
      if (!r.ok) toast(r.reason); else { chime(); if (r.msg) toast(r.msg); }
      renderAll(); save();
    }
  });

  async function pickPortFor(ui) {
    const opts = E.PORTS.map((p) => p.id === S.port ? '' : '<button type="button" data-tp="' + p.id + '"><span><b style="font-family:var(--f-ui)">' + p.name + '</b><span class="sub">장부: ' + ageText(S.month - S.known[p.id].month) + ', ' + E.travelMonths(S, S.port, p.id) + '개월 거리</span></span></button>').join('');
    openOv('<div class="sheet"><h2>탐문</h2><p>어느 항구의 지금 시세를 알아볼까?</p><div class="odds">' + opts + '</div><div class="acts2"><button class="btn ghost" type="button" data-close>그만두기</button></div></div>');
    const b = await waitClick('[data-tp],[data-close]');
    if (b.dataset.tp === undefined) return;
    closeOv();
    const r = E.useCons(S, ui, +b.dataset.tp); if (r.ok) TELE.ev('cons_use', { id: 'whisper', port: +b.dataset.tp, m: S.month });
    if (!r.ok) toast(r.reason); else { chime(); toast(r.msg); tab = 'ledger'; }
    renderAll(); save();
  }

  // ── 오버레이 공통 ──
  const ov = $('#ov');
  function openOv(html) { ov.innerHTML = html; ov.hidden = false; const f = ov.querySelector('[data-focus]') || ov.querySelector('button'); if (f) f.focus(); }
  function closeOv() { hideTip(); ov.hidden = true; ov.innerHTML = ''; $('#crew').classList.remove('lift'); }
  function waitClick(sel) {
    return new Promise((res) => {
      function h(e) { const b = e.target.closest(sel); if (!b) return; ov.removeEventListener('click', h); res(b); }
      ov.addEventListener('click', h);
    });
  }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  function coins(n, x, y) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('span'); c.className = 'coin';
      c.style.left = x + 'px'; c.style.top = y + 'px';
      const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 180;
      c.style.setProperty('--dx', Math.cos(a) * r + 'px'); c.style.setProperty('--dy', (Math.sin(a) * r * 0.6 + 140) + 'px');
      c.style.animationDelay = Math.random() * 0.12 + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
    }
  }
  async function showReport(title, lines) {
    openOv('<div class="sheet"><h2>' + title + '</h2><ul class="lines">' + lines.map((l) => '<li>' + l + '</li>').join('') + '</ul><div class="acts2"><button class="btn" type="button" data-ok data-focus>계속</button></div></div>');
    await waitClick('[data-ok]'); closeOv();
  }

  // ── 판매 정산 연쇄 ──
  async function playCascade(r) {
    $('#crew').classList.add('lift');
    const base = r.steps[0];
    openOv('<div class="sheet casc" id="casc"><div class="ttl">' + base.label + '</div>' +
      '<div class="base">매각 ' + fmt(base.rev) + ' − 원가 ' + fmt(base.cost) + '</div>' +
      '<div class="total' + (base.v < 0 ? ' neg' : '') + '" id="ctot"><span class="num" id="cv">' + fmt(base.v) + '</span><small>냥 이익</small></div>' +
      '<ol id="cs"></ol><div class="hint" id="chint">누르면 건너뜁니다</div></div>');
    let skip = false;
    const onSkip = () => { skip = true; };
    ov.addEventListener('click', onSkip);
    const cv = $('#cv'), cs = $('#cs');
    let cur = base.v, delay = 560, i = 0;
    tone(330, 0.12, 'triangle', 0.1);
    function countTo(to) {
      return new Promise((res) => {
        const from = cur; cur = to;
        if (skip || reduce) { cv.textContent = fmt(to); res(); return; }
        const st = performance.now(), dur = 240;
        let fin = false;
        const end = () => { if (!fin) { fin = true; cv.textContent = fmt(to); res(); } };
        setTimeout(end, dur + 120);
        (function f(now) { if (fin) return; const k = Math.min(1, (now - st) / dur); cv.textContent = fmt(from + (to - from) * k); if (k < 1) requestAnimationFrame(f); else end(); })(st);
        $('#ctot').classList.toggle('neg', to < 0);
      });
    }
    for (const st of r.steps.slice(1)) {
      if (!skip) await sleep(delay);
      i++;
      const li = document.createElement('li');
      let ef = '', cls = '';
      if (st.kind === 'add') { ef = '+' + fmt(st.amount); cls = 'add'; }
      else if (st.kind === 'mult') { ef = '×' + st.mult.toFixed(2).replace(/\.?0+$/, ''); cls = 'mult'; }
      else if (st.kind === 'ledger') { ef = '×' + st.mult.toFixed(1); cls = 'ledger'; }
      else if (st.kind === 'info') { ef = '+' + fmt(st.amount); cls = 'add dim'; }
      else if (st.kind === 'boss') { ef = '−20%'; cls = 'boss'; }
      else if (st.kind === 'banner') { ef = '↻'; cls = 'banner'; }
      else if (st.kind === 'comm') { ef = '−' + fmt(-st.amount); cls = 'boss'; }
      else { ef = '–'; cls = 'dim'; }
      li.className = cls;
      li.innerHTML = '<span>' + st.label + (st.kind === 'info' ? ' (매각가에 반영됨)' : '') + '</span><span class="ef">' + ef + '</span>';
      cs.appendChild(li);
      if (st.idx !== undefined && st.idx >= 0) {
        const card = document.querySelector('#emps .emp[data-idx="' + st.idx + '"]');
        if (card) {
          card.classList.remove('fire'); void card.offsetWidth; card.classList.add('fire');
          const fl = document.createElement('span'); fl.className = 'floaty'; fl.textContent = ef; card.appendChild(fl); setTimeout(() => fl.remove(), 900);
        }
      }
      if (st.kind === 'banner') { chime(); thud(true); const cc = $('#casc'); cc.classList.remove('shake'); void cc.offsetWidth; cc.classList.add('shake'); delay = Math.max(delay, 420); }
      else if (st.kind === 'mult' || st.kind === 'ledger') { tone(330 * Math.pow(1.122, i + 2), 0.14, 'triangle', 0.13); thud(false); }
      else if (st.kind === 'add') tone(330 * Math.pow(1.122, i), 0.1, 'square', 0.06);
      else tone(200, 0.08, 'sine', 0.05);
      await countTo(st.v);
      delay = Math.max(200, delay * 0.82);
    }
    if (!skip) await sleep(260);
    cv.textContent = fmt(r.profit);
    const sheet = $('#casc');
    const big = r.profit >= Math.max(800, Math.abs(base.v) * 2.5);
    const st = document.createElement('div');
    if (r.profit > 0) { st.className = 'stamp' + (big ? ' big' : ''); st.innerHTML = '成<small>+' + fmt(r.profit) + '</small>'; }
    else { st.className = 'stamp grey'; st.innerHTML = '損<small>' + fmt(r.profit) + '</small>'; }
    sheet.appendChild(st);
    thud(big);
    if (r.profit > 0) {
      sheet.classList.add('shake');
      const rect = sheet.getBoundingClientRect();
      coins(big ? 34 : 12, rect.left + rect.width * 0.75, rect.top + 40);
      coinSound(big ? 14 : 5);
      if (big) chime();
    }
    $('#chint').textContent = '누르면 닫힙니다';
    ov.removeEventListener('click', onSkip);
    await Promise.race([sleep(skip ? 900 : 1800), new Promise((res) => ov.addEventListener('click', res, { once: true }))]);
    closeOv();
  }

  // ── 상환 정산 ──
  async function showSettlement(st) {
    const ok = st.ok;

  // ── 진행 ──
  async function depart(dest) {
    if (busy || dest === null) return;
    busy = true;
    const from = S.port, months = E.travelMonths(S, from, dest);
    const risk = { pirate: +E.pirateRisk(S, from, dest, months).toFixed(3), storm: +E.stormRisk(S, months).toFixed(3) };
    const tsec = TELE.turnSec(), cargoV = Math.round(E.cargoValue(S, S.port)), cashB = Math.round(S.cash);
    const r = E.startVoyage(S, dest);
    if (!r.ok) { toast(r.reason); busy = false; return; }
    TELE.ev('voyage', { from, to: dest, months, risk, decisionSec: tsec, cargoValue: cargoV, cash: cashB, events: (r.events || []).map((e) => e.type), pirate: !!r.pirate, m: S.month });
    selDest = null; renderMap();
    if (r.wageLeft && r.wageLeft.length) await showReport('밀린 월급', r.wageLeft.map((id) => E.EMP[id].name + '이(가) 월급을 못 받고 떠났다.'));
    for (const st of r.settled || []) await showSettlement(st);
    if (S.reward && !S.over && !S.win) await rewardPick();
    if (S.over || S.win) { save(); renderAll(); await showEnd(); busy = false; return; }
    let arrival = r.arrival;
    const to = r.pirate ? S.pending.dest : S.port;
    if (r.pirate) {
      await animateShip(from, to, months, 0, 0.55);
      if (r.events && r.events.length) await showReport('항해 보고', r.events.map((e) => e.text));
      const out = await pirateFlow();
      arrival = out.arrival;
      await animateShip(from, to, months, 0.55, 1);
    } else {
      await animateShip(from, to, months);
      if (r.events && r.events.length) await showReport('항해 보고', r.events.map((e) => e.text));
    }
    shipPos = null;
    if (arrival && arrival.events.length) await showReport(E.PORTS[S.port].name + ' 입항', arrival.events.map((e) => e.text));
    revealPending = true; tab = 'market';
    TELE.ev('turn', TELE.snap());
    renderAll(); save();
    playRevealSounds();
    busy = false;
  }

  async function waitHere() {
    if (busy) return; busy = true;
    const r = E.waitMonth(S);
    TELE.ev('wait', { decisionSec: TELE.turnSec(), m: S.month, port: S.port });
    if (r.wageLeft && r.wageLeft.length) await showReport('밀린 월급', r.wageLeft.map((id) => E.EMP[id].name + '이(가) 월급을 못 받고 떠났다.'));
    for (const st of r.settled || []) await showSettlement(st);
    if (S.reward && !S.over && !S.win) await rewardPick();
    if (S.over || S.win) { save(); renderAll(); await showEnd(); busy = false; return; }
    if (r.arrival && r.arrival.events.length) await showReport(E.PORTS[S.port].name + '에서 한 달', r.arrival.events.map((e) => e.text));
    revealPending = true; tab = 'market';
    renderAll(); save(); playRevealSounds();
    busy = false;
  }

  function playRevealSounds() {
    const rv = S.lastReveal; if (!rv) return;
    const p = rv.port;
    const order = [0, 1, 2, 3, 4].sort((a, b) => (S.hold[a] > 0) - (S.hold[b] > 0));
    order.forEach((g, i) => {
      setTimeout(() => {
        const ratio = S.prices[p][g] / E.normalPrice(p, g);
        if (ratio >= 1.5 && S.hold[g] > 0) { chime(); coinSound(6); }
        else if (ratio >= 1.5) tone(990, 0.12, 'sine', 0.07);
        else tone(420 + i * 30, 0.04, 'square', 0.03);
      }, i * 160 + 120);
    });
    if (rv.confirmed && rv.confirmed.length) setTimeout(() => { chime(); thud(false); }, order.length * 160 + 200);
  }

  // ── 플레이 기록(지인 테스트용) ──
  // window.EUNBADA_CFG = { endpoint, token, channel } 가 있을 때만 전송. 없으면(아티팩트 등) 아무것도 보내지 않음.
  const TELE = (() => {
    const CFG = window.EUNBADA_CFG || null;
    const VER = 'proto-0.4.2';
    const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
    const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    const player = ls.get('eb.player', null) || { id: uid(), nick: '', consent: false };
    ls.set('eb.player', player);
    const session = uid();
    let game = null, seq = 0, turnT = Date.now(), gameT = Date.now();
    const queue = ls.get('eb.tq', []);
    function ev(type, data) {
      if (!CFG || player.optout) return;
      const e = Object.assign({ t: Date.now(), type, player: player.id, nick: player.nick, session, game, seq: seq++, ver: VER, ch: CFG.channel || '' }, data || {});
      queue.push(e); if (queue.length > 5000) queue.splice(0, queue.length - 5000);
      ls.set('eb.tq', queue);
      try { if (window.ebApp && window.ebApp.appendLog) window.ebApp.appendLog(JSON.stringify(e)); } catch (x) {}
      if (type === 'game_end' || type === 'survey' || queue.length >= 40) flush();
    }
    let sending = false;
    async function flush() {
      if (!CFG || !CFG.endpoint || sending || !queue.length) return;
      if (CFG.public && !player.consent) return; // 공개판: 동의 전에는 보내지 않음
      sending = true;
      const batch = queue.slice(0, 200);
      try {
        await fetch(CFG.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: CFG.token, events: batch }) });
        queue.splice(0, batch.length); ls.set('eb.tq', queue);
      } catch (x) { /* 오프라인: 다음에 다시 */ }
      sending = false;
    }
    if (CFG) {
      setInterval(flush, 20000);
      window.addEventListener('beforeunload', () => {
        ev('app_close', { inGame: !!(S && !S.over && !S.win && game), snap: S ? snap() : null });
        try { if (CFG.endpoint && queue.length && navigator.sendBeacon && (!CFG.public || player.consent)) { navigator.sendBeacon(CFG.endpoint, new Blob([JSON.stringify({ token: CFG.token, events: queue.slice(0, 200) })], { type: 'text/plain;charset=utf-8' })); } } catch (x) {}
      });
      window.addEventListener('error', (e) => ev('error', { msg: String(e.message || ''), src: String(e.filename || '').slice(-40), line: e.lineno }));
    }
    function snap() {
      return { m: S.month, port: S.port, cash: Math.round(S.cash), bank: Math.round(S.bank), cargo: E.cargoUsed(S), cap: E.capacity(S), guns: S.guns,
        emps: S.employees.slice(), cons: S.consumables.slice(), paid: S.paid, worth: E.netWorth(S), diff: S.diff, graces: S.graces };
    }
    return {
      get on() { return !!CFG && !player.optout; }, public: !!(CFG && CFG.public), player, ev, flush, snap,
      newGame() { game = uid(); gameT = Date.now(); turnT = Date.now(); },
      endGame() { const d = Math.round((Date.now() - gameT) / 1000); return d; },
      turnSec() { const d = Math.round((Date.now() - turnT) / 1000); turnT = Date.now(); return d; },
      setNick(n) { player.nick = n; player.consent = true; ls.set('eb.player', player); },
      optOut() { player.optout = true; player.consent = false; queue.length = 0; ls.set('eb.tq', queue); ls.set('eb.player', player); },
      get game() { return game; }, set game(g) { game = g; },
    };
  })();

  // ── 상점 ──
  function openShop() {
    hideTip();
    const sh = S.shop;
    const pv = (id) => { const r = E.previewHire(S, id); if (!r) return ''; return '<span class="pv">지난 ' + E.GOODS[r.g].name + ' ' + r.q + E.GOODS[r.g].unit + ' 판매였다면<br><b>' + (r.delta >= 0 ? '+' : '') + fmt(r.delta) + '냥</b>' + (r.expected ? ' (평균)' : '') + '</span>'; };
    const emps = sh.emps.map((id, i) => '<div class="shopitem">' + empCard(id, i, 'shop') + pv(id) + '<span class="price">' + fmt(E.EMP[id].cost) + '냥, 월급 ' + E.EMP[id].wage + '</span><button class="btn" type="button" data-hire="' + i + '"' + (S.cash >= E.EMP[id].cost && S.employees.length < E.MAX_EMP ? '' : ' disabled') + '>' + (S.employees.length >= E.MAX_EMP ? '자리 꽉 참' : S.cash < E.EMP[id].cost ? '현금 부족' : '고용') + '</button></div>').join('') || '<p>고용할 사람이 없습니다.</p>';
    const cons = sh.cons.map((id, i) => { const k = E.CONS[id], c = E.consCost(S, id); const maxed = k.good !== undefined && S.ledger[k.good] + S.consumables.filter((x) => x === id).length >= 3; return '<div class="shopitem">' + conCard(id) + '<span class="price">' + fmt(c) + '냥</span><button class="btn ghost" type="button" data-bc="' + i + '"' + (!maxed && S.cash >= c && S.consumables.length < E.MAX_CONS ? '' : ' disabled') + '>' + (maxed ? '최고 단계' : S.consumables.length >= E.MAX_CONS ? '자리 꽉 참' : S.cash < c ? '현금 부족' : '사기') + '</button></div>'; }).join('') || '<p>남은 물건이 없습니다.</p>';
    const myth = sh.emps.some((id) => E.EMP[id].rarity === 4);
    if (myth && !sh.mythSeen) { sh.mythSeen = true; setTimeout(() => { chime(); thud(true); }, 80); }
    openOv('<div class="sheet" style="width:min(720px,100%)"><h2>' + E.PORTS[S.port].name + ' 상점</h2>' + (myth ? '<p class="mythnote">갑급 직원이 나타났다! 이번 입항에만 있다.</p>' : '') +
      '<p class="age">현금 <b class="num">' + fmt(S.cash) + '</b>냥. 직원 ' + S.employees.length + '/' + E.MAX_EMP + ', 소모품 ' + S.consumables.length + '/' + E.MAX_CONS + '. 카드에 마우스를 올리거나 누르면 설명이 나옵니다. 입항할 때마다 물건이 바뀝니다.' + (S.employees.length >= E.MAX_EMP ? ' 직원 자리가 꽉 찼습니다. 새로 고용하려면 먼저 한 명을 해고하세요.' : '') + '</p>' +
      '<h3 class="shop-h">직원</h3><div class="shop-row">' + emps + '</div><h3 class="shop-h">소모품</h3><div class="shop-row">' + cons + '</div>' +
      '<div class="acts2"><button class="btn ghost" type="button" data-reroll' + (S.cash >= E.rerollCost(S) ? '' : ' disabled') + '>새로 고르기 ' + fmt(E.rerollCost(S)) + '냥</button><button class="btn" type="button" data-close data-focus>닫기</button></div></div>');
  }
  ov.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.hire !== undefined) { const hid = S.shop.emps[+b.dataset.hire]; const r = E.hire(S, +b.dataset.hire); if (r.ok) TELE.ev('hire', { id: hid, tier: E.EMP[hid].rarity, cost: E.EMP[hid].cost, m: S.month, port: S.port }); if (!r.ok) toast(r.reason); else { thud(false); coinSound(4); } renderAll(); openShop(); save(); }
    else if (b.dataset.bc !== undefined) { const bid = S.shop.cons[+b.dataset.bc]; const r = E.buyCons(S, +b.dataset.bc); if (r.ok) TELE.ev('cons_buy', { id: bid, m: S.month }); if (!r.ok) toast(r.reason); else coinSound(3); renderAll(); openShop(); save(); }
    else if (b.dataset.reroll !== undefined) { const r = E.reroll(S); if (r.ok) TELE.ev('reroll', { m: S.month }); if (!r.ok) toast(r.reason); renderAll(); openShop(); save(); }
    else if (b.dataset.fuse !== undefined && !busy) doFuse();
    else if (b.dataset.close !== undefined && !busy) closeOv();
  });
  ov.addEventListener('click', (e) => {
    const pk = e.target.closest('[data-pick]'); if (!pk || busy) return;
    const i = +pk.dataset.pick, at = fuseSel.indexOf(i);
    if (at >= 0) fuseSel.splice(at, 1); else if (fuseSel.length < 3) fuseSel.push(i);
    tone(500 + fuseSel.length * 80, 0.05, 'square', 0.04);
    openFuse();
  });
  document.addEventListener('keydown', (e) => {
    if (ov.hidden) return;
    if (e.key === 'Escape' && !busy) closeOv();
    if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) { const b = ov.querySelector('[data-ok]'); if (b) b.click(); }
  });

  // ── 전체 ──
  function renderAll() {
    renderHeader(); renderBoss(); renderMap(); renderVoyage(); renderTabs(); renderLog(); renderCrew();
    if (tab === 'market') revealPending = false;
  }

  function newRun() {
    S = E.newGame((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    selDest = null; revealPending = false; tab = 'market';
    renderAll(); save(); intro();
  }
  $('#btn-new').addEventListener('click', async () => {
    if (busy) return;
    openOv('<div class="sheet"><h2>새 판을 시작할까요?</h2><p>지금 판은 사라집니다.</p><div class="acts2"><button class="btn ghost" type="button" data-close data-focus>그대로 두기</button><button class="btn seal" type="button" data-yes>새 판</button></div></div>');
    const b = await waitClick('[data-yes],[data-close]');
    if (b.dataset.yes !== undefined) { if (TELE.game && !S.over && !S.win) TELE.ev('game_abandon', TELE.snap()); TELE.game = null; closeOv(); newRun(); }
  });

  async function rewardPick() {
    if (!S.reward) return;
    const opts = S.reward.options.map((o, i) => '<button type="button" data-rw="' + i + '"' + ((o.type === 'emp' && S.employees.length >= E.MAX_EMP) || (o.price && S.cash < o.price) ? ' disabled' : '') + '><span><b style="font-family:var(--f-ui)">' + o.label + '</b><span class="sub">' + o.desc + (o.type === 'emp' && S.employees.length >= E.MAX_EMP ? ' (직원 자리가 꽉 차서 고를 수 없음)' : '') + (o.price && S.cash < o.price ? ' (현금이 모자라 고를 수 없음)' : '') + '</span></span></button>').join('');
    const hasMyth = S.reward.options.some((o) => o.myth);
    openOv('<div class="sheet"><h2>결산 보상</h2><p>상환을 마치자 진 대인이 하나를 골라 가라고 한다.</p>' + (hasMyth ? '<p class="mythnote">연말 결산을 넘긴 상인에게 갑급 직원이 찾아왔다.</p>' : '') + '<div class="odds">' + opts + '</div></div>');
    if (hasMyth) { chime(); thud(true); }
    const b = await waitClick('[data-rw]:not([disabled])');
    const ro = S.reward && S.reward.options[+b.dataset.rw];
    const r = E.pickReward(S, +b.dataset.rw);
    if (r.ok) TELE.ev('reward', { kind: ro.type, id: ro.id || null, myth: !!ro.myth, price: ro.price || 0, m: S.month });
    closeOv();
    if (!r.ok) toast(r.reason); else { thud(false); chime(); }
    renderAll(); save();
  }
  async function consentThen(next) {
    const pub = TELE.public;
    openOv('<div class="sheet"><h2>' + (pub ? '공개 시험판' : '지인 테스트판') + '</h2><p>이 게임은 개발 중인 시험판입니다. 더 재미있게 고치려고 <b>플레이 기록</b>(별명, 매매와 항해 같은 게임 진행, 판이 끝난 뒤 설문)을 개발자에게 보냅니다. 이름, 연락처 같은 개인정보는 모으지 않습니다.' + (pub ? ' 보내고 싶지 않으면 아래 <b>기록 없이 하기</b>를 누르세요. 게임은 똑같이 할 수 있습니다.' : '') + '</p>' +
      '<p><label for="nick">별명(' + (pub ? '비워 두면 익명' : '개발자가 누구 기록인지 알아볼 정도면 됩니다') + ')</label><br><input id="nick" type="text" maxlength="20" placeholder="예: 바다사나이" style="width:100%;padding:8px;margin-top:6px;font:inherit"></p>' +
      '<div class="acts2">' + (pub ? '<button class="btn ghost" type="button" data-no>기록 없이 하기</button>' : '') + '<button class="btn seal" type="button" data-ok data-focus>동의하고 시작</button></div></div>');
    const b = await waitClick('[data-ok], [data-no]');
    if (b && b.dataset.no !== undefined) { TELE.optOut(); next(); return; }
    TELE.setNick((($('#nick') && $('#nick').value) || '').trim().slice(0, 20) || '익명');
    TELE.ev('consent', {});
    next();
  }
  async function intro() {
    const diffBtns = Object.keys(E.DIFFS).map((k) => { const tmp = E.newGame(1, { diff: k }); return '<button type="button" data-diff="' + k + '"><span><b style="font-family:var(--f-ui)">' + E.DIFFS[k].name + '</b><span class="sub">빚 총 ' + fmt(E.totalDebt(tmp)) + '냥' + (k === 'easy' ? ', 처음 하는 분께 권합니다' : k === 'hard' ? ', 직원 조합을 아는 분께' : '') + '</span></span></button>'; }).join('');
    openOv('<div class="sheet intro"><h2>은의 바다</h2><p>1580년 류큐 나하. 당신은 진 대인에게 큰 빚을 진 상인입니다. 3년 동안 아홉 번에 걸쳐 빚을 갚아야 합니다.</p>' +
      '<ol><li>항구마다 시세가 다릅니다. 싸게 사서 비싼 곳에 파세요. 다른 항구 시세는 마지막으로 본 값이라 틀릴 수 있습니다.</li>' +
      '<li>상점에서 직원을 고용하세요. 팔 때마다 직원이 1번 자리부터 차례로 이익을 불립니다.</li>' +
      '<li>상환일이 지나가는 순간 현금과 예금에서 돈을 걷어 갑니다. 모자라면 연체 기회를 쓰고(상환을 미루는 대신 다음에 1.2배), 기회가 없으면 화물을 헐값에 급매합니다. 그래도 모자라면 파산입니다. 해마다 9~12월에는 결산 보스가 규칙을 비틉니다.</li></ol>' +
      '<p style="margin-top:12px"><b>난이도</b></p><div class="odds">' + diffBtns + '</div></div>');
    const b = await waitClick('[data-diff]');
    S = E.newGame((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, { diff: b.dataset.diff });
    TELE.newGame(); S.teleGame = TELE.game;
    TELE.ev('game_start', { diff: S.diff, seed: S.seed, starterOptions: S.starter ? S.starter.slice() : [] });
    renderAll(); save();
    if (S.starter) await starterPick();
    else closeOv();
  }
  async function starterPick() {
    const cards = S.starter.map((id, i) => '<div class="shopitem">' + empCard(id, i, 'shop') + '<button class="btn seal" type="button" data-starter="' + i + '">데려가기</button></div>').join('');
    openOv('<div class="sheet" style="width:min(560px,100%)"><h2>첫 직원 고르기</h2><p>나하 부둣가에서 일자리를 찾는 사람이 셋 있다. 한 명을 월급만 주고 데려갈 수 있다(고용비 없음). 카드에 마우스를 올리면 설명이 나옵니다.</p>' +
      '<div class="shop-row" style="justify-content:center">' + cards + '</div></div>');
    const b = await waitClick('[data-starter]');
    E.pickStarter(S, +b.dataset.starter);
    TELE.ev('starter_pick', { id: S.employees[0] });
    closeOv(); thud(false); renderAll(); save();
  }

  function boot(data) {
    S = (data && data.state) || loadSaved();
    const fresh = !S;
    if (S && S.teleGame) TELE.game = S.teleGame;
    TELE.ev('app_open', { resumed: !fresh, ua: navigator.userAgent.slice(0, 80), vw: innerWidth, vh: innerHeight, sw: screen.width, sh: screen.height, dpr: devicePixelRatio });
    if (!S) S = E.newGame((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    drawMapStatic();
    renderAll();
    if (S.pending && S.pending.type === 'pirate') {
      busy = true;
      pirateFlow().then((out) => {
        if (out.arrival && out.arrival.events.length) return showReport(E.PORTS[S.port].name + ' 입항', out.arrival.events.map((e) => e.text));
      }).then(() => { revealPending = true; renderAll(); save(); busy = false; });
    } else if (fresh) { if (TELE.on && !TELE.player.consent && !TELE.player.optout) consentThen(intro); else intro(); }
    else if (S.starter) starterPick();
    else if (S.reward) rewardPick();
  }
  window.__eunbada = { get state() { return S; }, render: () => renderAll() }; // 디버그용
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: S }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
